[package]
name = "wse-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# WSE Desktop — the visual launcher. A native Win32 window (dark, owner-drawn
# cards) that lists your workspaces and lets you create / enter / launch /
# destroy with clicks. Same engine as the CLI, just a face on it.
[[bin]]
name = "wse-desktop"
path = "src/main.rs"

[dependencies]
wse-common = { path = "../common" }
wse-engine = { path = "../core" }
wse-adapter-windows-native = { path = "../adapters/windows-native" }
