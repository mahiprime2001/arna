# Catalog: <entry>|<command>. __TITLE__ is replaced by launch.sh with a unique
# per-instance marker so each launched window is individually discoverable.
# v1.0.0 maps every entry to a reliably-discoverable titled xterm. WHICH app a
# runtime runs is runtime DATA, not contract — a richer browser is a new runtime
# version, never a contract change.
browser|xterm -T __TITLE__ -fa Monospace -fs 11
editor|xterm -T __TITLE__ -fa Monospace -fs 11
terminal|xterm -T __TITLE__ -fa Monospace -fs 11
